[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler"
version = "0.1.0"
description = "Async HTTP crawler with queue, URL filters, rate limits, robots.txt, and storage"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "aiofiles>=23.0.0,<25.0.0",
    "asyncpg>=0.29.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
